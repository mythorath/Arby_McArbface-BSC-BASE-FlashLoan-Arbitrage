[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56, url = "https://api.bscscan.com/api" }
base = { key = "${BASESCAN_API_KEY}", chain = 8453, url = "https://api.basescan.org/api" }

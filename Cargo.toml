[workspace]
resolver = "2"
members = [
    "crates/arb-core",
    "crates/arb-state",
    "crates/arb-paths",
    "crates/arb-sim",
    "crates/arb-submit",
    "crates/arb-mempool",
    "crates/arb-rpc",
    "crates/arb-runner",
    "crates/arb-discovery",
]

[workspace.dependencies]
alloy = { version = "1", features = ["full", "signer-local"] }
alloy-primitives = "1"
alloy-sol-types = "1"
alloy-provider = { version = "1", features = ["ws"] }
alloy-transport-ws = "1"
alloy-rpc-types = "1"
alloy-contract = "1"
alloy-network = "1"
alloy-signer-local = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dashmap = "6"
rayon = "1.10"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
url = "2"
hex = "0.4"
prometheus = "0.13"
hyper = { version = "1", features = ["full"] }
rand = "0.8"
parking_lot = "0.12"

chrono = { version = "0.4", features = ["serde"] }
hex-literal = "0.4"

arb-core = { path = "crates/arb-core" }
arb-state = { path = "crates/arb-state" }
arb-paths = { path = "crates/arb-paths" }
arb-sim = { path = "crates/arb-sim" }
arb-submit = { path = "crates/arb-submit" }
arb-mempool = { path = "crates/arb-mempool" }
arb-rpc = { path = "crates/arb-rpc" }
arb-discovery = { path = "crates/arb-discovery" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

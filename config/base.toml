[chain]
chain_id = 8453
name = "Base"
rpc_https = "${BASE_RPC_URL}"
rpc_wss = "${BASE_WSS_URL}"
trader_rpc = "${BASE_TRADER_NODE}"   # Standard Trader node, $0.15/call — ONLY for tx submission
arb_contract = "${BASE_ARB_CONTRACT}"
state_reader = "${BASE_STATE_READER}"
block_time_ms = 2000
scan_budget_ms = 500

[wallet]
private_key_env = "PRIVATE_KEY"

[scanner]
flash_tokens = ["USDC", "WETH"]
min_profit_bps = 0
min_initial_bps = 0
optimization_iterations = 30
dry_run = false

[scanner.flash_amounts]
USDC = 5000000                # 5 USDC (6 dec) — known to find candidates
WETH = 2000000000000000       # 0.002 ETH (~$5)

[scanner.flash_bounds.USDC]
min = 1000000
max = 50000000000

[scanner.flash_bounds.WETH]
min = 1000000000000000
max = 5000000000000000000

[gate]
min_profit_usd = 0.001
safety_margin_bps = 0
stable_pool_extra_margin_bps = 0

[submission]
blink_url       = "${BLINK_BASE_URL}"
warp_threshold_usd = 50.0
direct_fallback = true

[token_usd_prices]
WETH = 2500.0
USDC = 1.0
USDbC = 1.0
DAI = 1.0
cbETH = 2700.0
AERO = 1.20
cbBTC = 95000.0

